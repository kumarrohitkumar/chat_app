# Run the whole thing locally with one command:
#   docker compose up --build
# Then open http://localhost:5001
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      # Published on 27018 so it does not collide with a MongoDB already
      # installed on the host. Inside the compose network it is still 27017.
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGO_URI: mongodb://mongo:27017/chatify
      # Local only. Generate a real one for any deployment.
      JWT_SECRET: local-compose-secret-change-me-0123456789abcdef
      # Images stay in memory locally unless you pass S3 settings through.
      ALLOW_MEMORY_IMAGES: "true"
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-ap-south-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
