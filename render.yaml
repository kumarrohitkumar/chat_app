# Render blueprint. Push this repo, then on render.com:
#   New  ->  Blueprint  ->  pick this repository.
# Render reads this file and creates the service. Set the three secret values
# marked `sync: false` in the dashboard when prompted.
services:
  - type: web
    name: chatify
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      # Paste a MongoDB Atlas connection string.
      - key: MONGO_URI
        sync: false
      # Render can generate this one for you.
      - key: JWT_SECRET
        generateValue: true
      # Private S3 bucket for images (required in production).
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
